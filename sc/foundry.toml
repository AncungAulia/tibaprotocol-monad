[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Required by OpenZeppelin Foundry Upgrades (validation runs via ffi + build info)
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
  { access = "read", path = "./previous-builds" },
]

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"

[etherscan]
monad = { key = "verifyContract", chain = 10143, url = "https://sourcify-api-monad.blockvision.org" }

[fmt]
line_length = 120
